<title>AI Portal — экраны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Прототип всех экранов AI Portal. Палитра индиго + IBM Plex Sans,
     ровно как в globals.css приложения. Один шелл, клиентский роутер по экранам. */
  :root {
    --primary: #4f46e5; --primary-dark: #4338ca; --primary-soft: #eef0fe;
    --bg: #f5f6fb; --card: #ffffff; --ink: #15172b; --muted: #6b7085;
    --line: #e7e8f1; --soft: #f1f2f9;
    --ok: #15935e; --okbg: #e6f6ef; --err: #dc2626; --errbg: #fcebeb;
    --warn: #b7791f; --warnbg: #faf1d9; --info: #2563eb; --infobg: #e7eefe;
    --read: #5b6472; --readbg: #eef0f4;
    --shadow: 0 8px 24px rgba(30,24,80,.06); --shadow-pop: 0 16px 40px rgba(20,16,60,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #8b85f5; --primary-dark: #a7a2f8; --primary-soft: #23213a;
      --bg: #0f1018; --card: #181a26; --ink: #eceef6; --muted: #9aa0b4;
      --line: #272a3a; --soft: #20222f;
      --ok: #34d399; --okbg: #10291f; --err: #f87171; --errbg: #2d1515;
      --warn: #fbbf24; --warnbg: #2d2512; --info: #60a5fa; --infobg: #122033;
      --read: #9aa0b4; --readbg: #222534;
      --shadow: 0 8px 24px rgba(0,0,0,.4); --shadow-pop: 0 16px 40px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --primary: #8b85f5; --primary-dark: #a7a2f8; --primary-soft: #23213a;
    --bg: #0f1018; --card: #181a26; --ink: #eceef6; --muted: #9aa0b4;
    --line: #272a3a; --soft: #20222f;
    --ok: #34d399; --okbg: #10291f; --err: #f87171; --errbg: #2d1515;
    --warn: #fbbf24; --warnbg: #2d2512; --info: #60a5fa; --infobg: #122033;
    --read: #9aa0b4; --readbg: #222534;
    --shadow: 0 8px 24px rgba(0,0,0,.4); --shadow-pop: 0 16px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  code { background: var(--soft); padding: 1px 5px; border-radius: 5px; font-size: .9em; }

  /* ---- mock toolbar ---- */
  .mockbar { background: #140a2e; color: #fff; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); }
  .mockbar b { font-size: 12.5px; font-weight: 700; color: #cfc8f5; }
  .mockbar .hint { font-size: 11.5px; color: #8f84bd; margin-left: auto; }
  .mockbar select { font-family: inherit; font-size: 13px; font-weight: 600; color: #fff; background: #2a1b52;
    border: 1px solid #3c2d6b; border-radius: 8px; padding: 6px 10px; cursor: pointer; }

  /* ---- header ---- */
  .hd { background: var(--card); border-bottom: 1px solid var(--line); }
  .hdin { max-width: 1060px; margin: 0 auto; height: 60px; display: grid; grid-template-columns: 1fr minmax(0, max-content) 1fr; align-items: center; gap: 24px;
    padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; flex: 0 0 auto; }
  nav.menu { display: flex; gap: 18px; align-items: center; overflow-x: auto; }
  nav.menu a { font-size: 14px; font-weight: 500; color: var(--ink); opacity: .72; white-space: nowrap; cursor: pointer; padding: 4px 0; border-bottom: 2px solid transparent; }
  nav.menu a.on { opacity: 1; color: var(--primary-dark); font-weight: 600; border-bottom-color: var(--primary); }
  .right { justify-self: end; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-dark); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .avname { font-size: 12.5px; font-weight: 600; line-height: 1.1; } .avrole { font-size: 11px; color: var(--muted); }
  @media (max-width: 680px) { .right .who { display: none; } .hdin { grid-template-columns: 0 minmax(0, 1fr) auto; gap: 10px; } .hmid { gap: 8px; } nav.menu { min-width: 0; } }

  /* ---- layout ---- */
  .main { max-width: 1060px; margin: 0 auto; padding-block: 26px 70px;
    padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); }
  .narrow { max-width: 760px; margin: 0 auto; }
  .pagehead { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  h1.title { font-size: 23px; font-weight: 700; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  h2.title { font-size: 17px; font-weight: 700; margin: 0 0 12px; }
  .lead { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .spacer { margin-left: auto; }
  .back { font-size: 13px; color: var(--primary-dark); font-weight: 600; margin-bottom: 14px; display: inline-flex; gap: 6px; cursor: pointer; }

  /* ---- buttons ---- */
  .btn { font-family: inherit; font-size: 13.5px; font-weight: 600; border-radius: 9px; padding: 9px 15px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: .12s; white-space: nowrap; }
  .btn.primary { background: var(--primary); color: #fff; } .btn.primary:hover { background: var(--primary-dark); }
  .btn.ghost { background: var(--card); border-color: var(--line); color: var(--ink); } .btn.ghost:hover { border-color: var(--primary); color: var(--primary-dark); }
  .btn.danger { background: var(--card); border-color: color-mix(in srgb, var(--err) 40%, transparent); color: var(--err); }
  .btn.sm { padding: 6px 11px; font-size: 12.5px; } .btn.block { width: 100%; justify-content: center; }

  /* ---- cards ---- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .card.pad { padding: 20px; }
  .grid { display: grid; gap: 16px; } .grid.c2 { grid-template-columns: 1fr 1fr; } .grid.c3 { grid-template-columns: repeat(3,1fr); }
  @media (max-width: 760px) { .grid.c2, .grid.c3 { grid-template-columns: 1fr; } }

  /* ---- course card ---- */
  .course { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: .14s; }
  .course:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); border-color: color-mix(in srgb, var(--primary) 35%, var(--line)); }
  .emoji { width: 44px; height: 44px; border-radius: 12px; background: var(--primary-soft); display: grid; place-items: center; font-size: 22px; }
  .course h3 { font-size: 15.5px; font-weight: 700; margin: 0; } .course .desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; flex: 1; margin: 0; }

  /* ---- progress ---- */
  .pbar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .pbar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), #7c74f0); }
  .pbar.done > span { background: linear-gradient(90deg, var(--ok), #3ec98a); }
  .pmeta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  /* ---- pills ---- */
  .st { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 20px; display: inline-block; white-space: nowrap; }
  .st.ok { background: var(--okbg); color: var(--ok); } .st.wait { background: var(--warnbg); color: var(--warn); }
  .st.info { background: var(--infobg); color: var(--info); } .st.err { background: var(--errbg); color: var(--err); } .st.mut { background: var(--readbg); color: var(--read); }

  /* ---- tables ---- */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 14px 15px; white-space: nowrap; background: transparent; border-bottom: 1px solid var(--line); }
  td { padding: 12px 15px; font-size: 13.5px; border-bottom: 1px solid var(--line); } tr:last-child td { border-bottom: 0; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; } .b { font-weight: 600; }
  .tcard { overflow-x: auto; } .tcard table { min-width: 460px; }
  .tbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .search { position: relative; flex: 0 1 290px; margin: 0; } .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input { padding: 10px 13px 10px 36px; } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .btn.dashed { background: var(--card); border: 1px dashed var(--line); color: var(--primary-dark); } .btn.dashed:hover { border-color: var(--primary); }
  td.acts { text-align: right; white-space: nowrap; width: 1%; }
  .ibtn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--ink); display: inline-grid; place-items: center; cursor: pointer; }
  .ibtn:hover { background: var(--soft); } .ibtn.del { color: var(--err); } .ibtn:disabled { opacity: .3; cursor: default; background: transparent; }
  .link { cursor: pointer; } .link:hover { color: var(--primary-dark); text-decoration: underline; }
  tr.off td { opacity: .55; }

  /* ---- stat tiles ---- */
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .stat .n { font-size: 25px; font-weight: 800; letter-spacing: -.02em; } .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---- timeline ---- */
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); }
  .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline li .dot { position: absolute; left: -7px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card); box-shadow: 0 0 0 2px var(--primary-soft); }
  .timeline li.ok .dot { background: var(--ok); box-shadow: 0 0 0 2px var(--okbg); }
  .timeline .tt { font-size: 13px; font-weight: 600; } .timeline .ts { font-size: 12px; color: var(--muted); margin-top: 1px; }

  /* ---- forms ---- */
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .req { color: var(--err); }
  input, select.f { width: 100%; font-family: inherit; font-size: 14px; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; background: var(--card); }
  input:focus, select.f:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .field { margin-bottom: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; } .hint a { color: var(--primary-dark); font-weight: 600; }
  .pwd { position: relative; } .pwd input { padding-right: 44px; }
  .pwd button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 15px; padding: 6px; }
  .formerr { color: var(--err); font-size: 13px; background: var(--errbg); border-radius: 9px; padding: 10px 13px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; } .toggle input { width: auto; }

  /* ---- callout + prose ---- */
  .prose { font-size: 15px; line-height: 1.7; } .prose h3 { font-size: 17px; margin: 0 0 12px; }
  .prose p { margin: 12px 0; } .prose ul { margin: 12px 0; padding-left: 20px; } .prose li { margin: 5px 0; }
  .callout { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 13px 15px; margin: 16px 0; display: flex; gap: 11px; font-size: 13.5px; }
  .callout.tip { background: var(--okbg); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
  .callout.info { background: var(--infobg); border-color: color-mix(in srgb, var(--info) 25%, transparent); }

  /* ---- quiz ---- */
  .quiz { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 18px; margin: 20px 0; box-shadow: var(--shadow); }
  .quiz .qh { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--primary-dark); font-weight: 700; }
  .quiz .q { font-weight: 600; margin: 14px 0 8px; font-size: 14px; }
  .opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 7px 0; font-size: 13.5px; }
  .opt.correct { border-color: var(--ok); background: var(--okbg); } .opt.wrong { border-color: var(--err); background: var(--errbg); }
  .opt .mk { margin-left: auto; font-weight: 700; } .opt.correct .mk { color: var(--ok); } .opt.wrong .mk { color: var(--err); }

  /* ---- bars (stats) ---- */
  .months { display: flex; align-items: flex-end; gap: 12px; height: 130px; }
  .months .col { flex: 1; text-align: center; } .months .bar { height: 94px; display: flex; align-items: flex-end; }
  .months .bar > div { width: 100%; border-radius: 8px 8px 0 0; background: linear-gradient(180deg, var(--primary), #7c74f0); }

  /* ---- status (connection test) ---- */
  .status { font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 9px; }
  .status.ok { background: var(--okbg); color: var(--ok); } .status.err { background: var(--errbg); color: var(--err); } .status.checking { background: var(--infobg); color: var(--info); }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } } @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button { font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: transparent; border: 0; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--primary-dark); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chead { display: flex; align-items: center; gap: 12px; } .chead .ic { width: 42px; height: 42px; border-radius: 11px; background: var(--primary-soft); display: grid; place-items: center; font-size: 20px; flex: 0 0 auto; }
  .chead h2 { font-size: 16px; font-weight: 700; margin: 0; } .chead .sub2 { font-size: 12px; color: var(--muted); }

  /* ---- auth ---- */
  .authwrap { min-height: 72vh; display: grid; place-items: center; padding: 30px 16px; }
  .authcard { width: 100%; max-width: 400px; } .authhead { text-align: center; margin-bottom: 20px; }

  .wrapgap { display: flex; flex-wrap: wrap; gap: 9px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .muted { color: var(--muted); }
  pre.log { white-space: pre-wrap; font-size: 12px; background: var(--soft); padding: 12px; border-radius: 8px; line-height: 1.55; margin: 8px 0 0; }

  /* constructor */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 13px; cursor: pointer; }
  .tabs button.on { color: var(--primary-dark); border-bottom-color: var(--primary); }
  .canvas { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 22px; overflow-x: auto; }
  .nodes { display: flex; gap: 40px; align-items: flex-start; min-width: 660px; }
  .node { width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; flex: 0 0 auto; }
  .node .nhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .node .nhead .tag { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--primary); border-radius: 6px; padding: 2px 7px; }
  .node .nhead .tag.fin { background: var(--readbg); color: var(--read); }
  .node .nhead .nm { font-weight: 700; font-size: 14px; }
  .nlabel { font-size: 10px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 12px 0 5px; }
  .npill { display: inline-block; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; margin: 0 5px 5px 0; color: var(--ink); background: var(--soft); }
  .npill.off { color: var(--muted); text-decoration: line-through; }
  .npill.mcp { color: var(--primary-dark); background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
  .ntext { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 9px; background: var(--card); line-height: 1.5; }
  .arrow { align-self: center; color: var(--muted); font-size: 22px; flex: 0 0 auto; }

  /* chat thread */
  .thread { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
  .msg.u { align-self: flex-end; background: var(--primary-soft); color: var(--primary-dark); border-bottom-right-radius: 4px; }
  .msg.b { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.b.warn { background: var(--warnbg); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .route { align-self: center; font-size: 12px; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px; }
  .route b { color: var(--primary-dark); }
  .hitl { align-self: flex-start; max-width: 88%; border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--line)); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); padding: 14px; }
  .hitl .ht { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
  .hitl .hd { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }

  /* expanding section tray (9 dots next to the logo) */
  .lbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: 0 0 auto; }
  .lbtn:hover, .lbtn.on { background: var(--soft); border-color: var(--line); color: var(--primary-dark); }
  .lbtn:focus-visible, .titem:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .hmid { grid-column: 2; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .hdin > .right { grid-column: 3; }
  nav.menu { min-width: 120px; min-height: 36px; }
  nav.menu.drop { outline: 2px dashed var(--primary); outline-offset: 4px; border-radius: 8px; }
  nav.menu a[draggable="true"] { cursor: grab; }
  nav.menu { padding: 0 10px; } nav.menu a { position: relative; } nav.menu a.dragging { opacity: .35; }
  nav.menu a.ins-l::before, nav.menu a.ins-r::after { content: ''; position: absolute; top: 2px; bottom: 2px; width: 2px; border-radius: 2px; background: var(--primary); }
  nav.menu a.ins-l::before { left: -10px; } nav.menu a.ins-r::after { right: -10px; }
  .tray { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .tray.open { grid-template-rows: 1fr; border-top: 1px solid var(--line); }
  .trayclip { overflow: hidden; min-height: 0; }
  .trayin { max-width: 1060px; margin: 0 auto; padding-block: 16px 14px; padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); border-radius: 12px; transition: background .15s; }
  .trayin.drop { background: var(--soft); }
  .tgroups { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 56px; }
  .tg { display: flex; flex-direction: column; align-items: flex-start; min-width: 120px; }
  .lgroup { align-self: stretch; font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--ink); font-weight: 700; padding: 4px 10px 8px; margin-bottom: 6px; border-bottom: 2px solid var(--primary-soft); }
  .lgroup .note { color: var(--muted); font-weight: 600; text-transform: none; letter-spacing: 0; }
  .titem { font-size: 14px; color: var(--ink); padding: 6px 10px; border-radius: 8px; cursor: grab; user-select: none; white-space: nowrap; }
  .titem:hover { background: var(--soft); color: var(--primary-dark); }
  .titem.dim { color: var(--muted); }
  .titem.cur { background: var(--soft); color: var(--primary-dark); font-weight: 600; }
  nav.menu a.temp { display: inline-flex; align-items: center; gap: 4px; }
  nav.menu a .pin { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--muted); cursor: pointer; }
  nav.menu a .pin:hover { background: var(--soft); color: var(--primary-dark); }
  nav.menu a .pin { opacity: 0; transition: opacity .12s; }
  nav.menu a.temp:hover .pin, nav.menu a.temp:focus-within .pin { opacity: 1; }
  @media (hover: none) { nav.menu a .pin { opacity: 1; } }

  function modelRow(id,name,url,agents,def){ return `<tr><td>#${id}</td><td><span class="b">${name}</span>${def ? '<span class="st info" style="margin-left:8px">по умолчанию</span>' : ''}</td><td class="muted">${url}</td><td>${agents}</td><td class="stcell"><span class="st ok">подключена</span></td><td class="acts">${ibtn('check','Проверить','data-rowtest')}${ibtn('edit','Изменить')}${ibtn('del','Удалить', def ? 'disabled' : '')}</td></tr>`; }
  function mcpRow(id,name,desc,tools,agents,status,cls){ return `<tr><td>#${id}</td><td><div class="b">${name}</div><div class="sub">${desc}</div></td><td><span title="${tools.join(', ')}">${tools.length}</span></td><td>${agents}</td><td class="stcell"><span class="st ${cls}">${status}</span></td><td class="acts">${ibtn('check','Проверить','data-rowtest')}${ibtn('edit','Настроить')}${ibtn('del','Удалить')}</td></tr>`; }
  function histGroup(title, items) { return `<div class="hgroup"><button type="button" class="hhead" data-hgroup aria-expanded="true">${title}<span class="chev">▾</span></button><div class="hitems">${items.map(([t, on]) => `<button type="button" class="hitem ${on ? 'on' : ''}" data-hitem>${t}</button>`).join('')}</div></div>`; }
  function cu(t, file) { return `<div class="cu">${file ? `<div class="cfile"><div class="b">${file}</div><span class="cft">PDF</span></div>` : ''}<div class="cub">${t}</div></div>`; }
  function ca(t) { return `<div class="ca">${t}</div>`; }
  function cstep(t, fail, details) { return `<details class="cstep"><summary>${t}${fail ? ` <span class="cfail">${fail}</span>` : ''} <span class="chev">▸</span></summary><pre>${details}</pre></details>`; }
  function umsg(t){ return `<div class="msg u">${t}</div>`; }
  function bmsg(t,k){ return `<div class="msg b ${k||''}">${t}</div>`; }
  function route(a){ return `<div class="route">диспетчер → подобран агент: <b>${a}</b></div>`; }
  function hitl(title,detail){ return `<div class="hitl"><div class="ht">⏸ Нужно подтверждение · ${title}</div><div class="hd">${detail}</div><div class="wrapgap"><button class="btn primary sm">Отправить</button><button class="btn ghost sm">Отмена</button></div></div>`; }
  function node(tag,tagCls,name,hitl,model,mcp,guards,trans,sys){ const pills=(arr,cls)=>arr.map(x=>`<span class="npill ${cls||''} ${/снят/.test(x)?'off':''}">${x.replace(' · снят','')}</span>`).join(''); return `<div class="node"><div class="nhead"><span class="tag ${tagCls==='fin'?'fin':''}">⚑ ${tag}</span><span class="nm">${name}</span><span class="spacer"></span><span class="muted">🗑</span></div><div class="nlabel">HITL</div><span class="npill">${hitl}</span><div class="nlabel">Модель</div><span class="npill">🧠 ${model}</span><div class="nlabel">MCP-инструменты</div>${pills(mcp,'mcp')}<div class="nlabel">Базы знаний</div><span class="npill off">нет</span><div class="nlabel">Гардрейлы</div>${pills(guards)}<div class="nlabel">Переход</div>${pills(trans)}<div class="nlabel">Системная инструкция</div><div class="ntext">${sys}</div><div class="muted" style="font-size:12px;margin-top:10px">⌄ Развернуть</div></div>`; }

  // ---- router ----
  const view = document.getElementById('view');
  const header = document.getElementById('appheader');
  const sel = document.getElementById('screenSel');
  // ---- pinned menu + expanding tray ----
  const NAV = {
    chat: { go: 'chat', label: 'Чат', sec: 'chat' },
    agents: { go: 'agents', label: 'Агенты', sec: 'agents' }, mcp: { go: 'mcp', label: 'MCP' }, settings: { go: 'settings', label: 'Модели' },
    learn: { go: 'learn', label: 'Обучение' }, stats: { go: 'stats', label: 'Траты' }, me: { go: 'me', label: 'Прогресс' },
    users: { go: 'users', label: 'Пользователи', sec: 'users' }, access: { go: 'access', label: 'Доступы', sec: 'access' },
  };
  const DEFAULT_PINS = ['chat', 'agents', 'mcp', 'settings'];
  let pins = DEFAULT_PINS.slice();
  try { const s = JSON.parse(localStorage.getItem('pinnedNav3') || 'null'); if (Array.isArray(s) && s.length && s.every(k => NAV[k])) pins = s; } catch (e) {}
  const nav = document.getElementById('nav');
  const tray = document.getElementById('tray'), trayin = document.getElementById('trayin'), lbtn = document.getElementById('lbtn');
  let current = 'chat';
  function savePins() { try { localStorage.setItem('pinnedNav3', JSON.stringify(pins)); } catch (e) {} }
  function highlight() {
    const sec = navSection[current];
    nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.go === current || a.dataset.key === navKeyFor(current) || (!!a.dataset.sec && a.dataset.sec === sec)));
  }
  // screens without their own menu item belong to their parent's item
  const SCREEN_KEY = { agent: 'agents', constructor: 'agents', course: 'learn', lesson: 'learn' };
  const PIN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4z"/></svg>';
  function navKeyFor(screen) { return Object.keys(NAV).find(k => NAV[k].go === screen) || SCREEN_KEY[screen]; }
  function renderNav() {
    const cur = navKeyFor(current);
    const link = (k, temp) => { const n = NAV[k];
      return `<a data-key="${k}" data-go="${n.go}" data-sec="${n.sec || ''}" draggable="true"${temp ? ' class="temp" title="Раздел не закреплён в меню"' : ''}>${n.label}${temp ? `<span class="pin" role="button" tabindex="0" data-pin="${k}" title="Закрепить в меню" aria-label="Закрепить в меню">${PIN}</span>` : ''}</a>`; };
    nav.innerHTML = pins.map(k => link(k)).join('') + (cur && !pins.includes(cur) ? link(cur, true) : '');
    document.querySelectorAll('.titem').forEach(t => t.classList.toggle('cur', t.dataset.key === cur));
    highlight();
  }
  nav.addEventListener('click', (e) => {
    const p = e.target.closest('[data-pin]'); if (!p) return;
    e.preventDefault(); e.stopPropagation();
    pins.push(p.dataset.pin); savePins(); renderNav();
  });
  nav.addEventListener('keydown', (e) => { const p = e.target.closest('[data-pin]'); if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); p.click(); } });
  function setTray(open) { tray.classList.toggle('open', open); lbtn.classList.toggle('on', open); lbtn.setAttribute('aria-expanded', String(open)); }
  lbtn.addEventListener('click', () => setTray(!tray.classList.contains('open')));
  tray.addEventListener('click', (e) => { if (e.target.closest('.titem')) setTray(false); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { setTray(false); document.querySelectorAll('.mbg').forEach(m => { m.hidden = true; }); }
    const t = e.target.closest && e.target.closest('.titem');
    if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setTray(false); go(t.dataset.go); }
  });

  // drag & drop: tray → menu pins, inside the menu reorders, menu → tray unpins
  let dragKey = null, dragFrom = null;
  document.addEventListener('dragstart', (e) => {
    const t = e.target.closest && e.target.closest('.titem, #nav a'); if (!t) return;
    dragKey = t.dataset.key; dragFrom = t.closest('#nav') ? 'nav' : 'tray'; t.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragKey);
  });
  document.addEventListener('dragend', () => { dragKey = dragFrom = null; nav.classList.remove('drop'); trayin.classList.remove('drop'); clearIns(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
  // where a drop at clientX lands among the pinned items (the dragged one excluded)
  function dropSlot(x) {
    const list = [...nav.querySelectorAll('a')].filter(a => a.dataset.key !== dragKey && pins.includes(a.dataset.key));
    const idx = list.filter(a => { const r = a.getBoundingClientRect(); return r.left + r.width / 2 < x; }).length;
    return { list, idx };
  }
  function clearIns() { nav.querySelectorAll('.ins-l, .ins-r').forEach(a => a.classList.remove('ins-l', 'ins-r')); }
  nav.addEventListener('dragover', (e) => {
    if (!dragKey) return;
    e.preventDefault(); nav.classList.add('drop'); clearIns();
    const { list, idx } = dropSlot(e.clientX);
    if (idx < list.length) list[idx].classList.add('ins-l'); else if (list.length) list[list.length - 1].classList.add('ins-r');
  });
  nav.addEventListener('dragleave', (e) => { if (!nav.contains(e.relatedTarget)) { nav.classList.remove('drop'); clearIns(); } });
  nav.addEventListener('drop', (e) => {
    e.preventDefault(); nav.classList.remove('drop'); if (!dragKey) return;
    const { list, idx } = dropSlot(e.clientX); clearIns();
    pins = list.map(a => a.dataset.key); pins.splice(idx, 0, dragKey);
    savePins(); renderNav();
  });
  trayin.addEventListener('dragover', (e) => { if (dragFrom === 'nav') { e.preventDefault(); trayin.classList.add('drop'); } });
  trayin.addEventListener('dragleave', (e) => { if (!trayin.contains(e.relatedTarget)) trayin.classList.remove('drop'); });
  trayin.addEventListener('drop', (e) => {
    e.preventDefault(); trayin.classList.remove('drop');
    if (dragFrom !== 'nav' || !dragKey || pins.length <= 1) return;
    pins = pins.filter(k => k !== dragKey); savePins(); renderNav();
  });
  const navSection = { chat:'chat', agents:'agents', agent:'agents', constructor:'agents', mcp:'mcp', settings:'settings', users:'users', access:'access', learn:'fam', course:'fam', lesson:'fam', stats:'fam', me:'fam' };

  function render(name) {
    if (!SCREENS[name]) name = 'chat';
    const isAuth = name === 'login' || name === 'invite';
    header.hidden = isAuth;
    if (isAuth) setTray(false);
    view.innerHTML = SCREENS[name]();
    sel.value = name;
    current = name; renderNav();
    window.scrollTo(0, 0);
    wireTables();
    if (name === 'settings') wireSettings();
    if (name === 'chat') wireChat();
  }
  function go(name) { location.hash = name; }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); go(t.dataset.go); }
  });
  sel.addEventListener('change', () => go(sel.value));
  window.addEventListener('hashchange', () => render(location.hash.slice(1)));

  // ---- settings interactions (bound after render) ----
  function wireSettings() {
    document.querySelectorAll('[data-tg]').forEach(btn => btn.addEventListener('click', () => { const i = document.getElementById(btn.dataset.tg); i.type = i.type === 'password' ? 'text' : 'password'; btn.textContent = i.type === 'password' ? '👁' : '🙈'; }));
    const MSG = { mail: { ok: '✓ Подключено — INBOX, 1240 писем за 30 дней', err: '✕ Не удалось войти — проверьте адрес и пароль приложения' }, llm: { ok: '✓ Модель ответила — glm-4, 420 мс', err: '✕ Не удалось подключиться — укажите адрес API и проверьте токен' } };
    document.querySelectorAll('[data-test]').forEach(btn => btn.addEventListener('click', () => {
      const k = btn.dataset.test, st = document.getElementById('st-' + k);
      const mock = k === 'llm' && !document.getElementById('mUrl').value.trim() ? 'err' : 'ok';
      st.hidden = false; st.className = 'status checking'; st.innerHTML = '<span class="spin"></span> Проверяем подключение…'; btn.disabled = true;
      setTimeout(() => { st.className = 'status ' + mock; st.textContent = MSG[k][mock]; btn.disabled = false; }, 1200);
    }));
    const form = document.getElementById('addModel');
    document.getElementById('addModelBtn').addEventListener('click', () => { form.hidden = false; document.getElementById('st-llm').hidden = true; form.querySelector('input').focus(); });
    document.getElementById('addModelCancel').addEventListener('click', () => { form.hidden = true; });
    form.addEventListener('click', (e) => { if (e.target === form) form.hidden = true; });
    document.getElementById('saveBtn').addEventListener('click', () => { form.hidden = true; showSaved('Модель добавлена'); });
  }
  function fitChat() { const w = document.getElementById('cwrap'); if (w) w.style.height = Math.max(420, window.innerHeight - w.getBoundingClientRect().top - 20) + 'px'; }
  window.addEventListener('resize', fitChat);
  function wireChat() {
    fitChat();
    const hist = document.getElementById('hist'), thread = document.getElementById('cthread'), empty = document.getElementById('cempty'), title = document.getElementById('ctitle'), sc = document.getElementById('cscroll');
    sc.scrollTop = sc.scrollHeight;
    const show = (t, isNew) => { title.textContent = t; thread.hidden = isNew; empty.hidden = !isNew; hist.classList.remove('open'); sc.scrollTop = isNew ? 0 : sc.scrollHeight; };
    hist.querySelectorAll('[data-hgroup]').forEach((b) => b.addEventListener('click', () => b.setAttribute('aria-expanded', String(b.getAttribute('aria-expanded') !== 'true'))));
    hist.querySelectorAll('[data-hitem]').forEach((b) => b.addEventListener('click', () => { hist.querySelectorAll('.hitem').forEach((x) => x.classList.toggle('on', x === b)); show(b.textContent, false); }));
    view.querySelector('[data-newchat]').addEventListener('click', () => { hist.querySelectorAll('.hitem').forEach((x) => x.classList.remove('on')); show('Новый чат', true); });
    view.querySelector('[data-histtoggle]').addEventListener('click', (e) => {
      if (matchMedia('(max-width: 760px)').matches) { hist.classList.toggle('open'); return; }
      const hidden = document.getElementById('cwrap').classList.toggle('nohist'), t = hidden ? 'Показать историю' : 'Скрыть историю';
      e.currentTarget.title = t; e.currentTarget.setAttribute('aria-label', t);
    });
    view.querySelector('[data-histsearch]').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      hist.querySelectorAll('.hgroup').forEach((g) => { let any = false; g.querySelectorAll('.hitem').forEach((x) => { const ok = !q || x.textContent.toLowerCase().includes(q); x.hidden = !ok; any = any || ok; }); g.hidden = !any; });
    });
    const ta = view.querySelector('.ccomp textarea');
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  }
  function wireTables() {
    view.querySelectorAll('[data-open]').forEach((btn) => btn.addEventListener('click', () => {
      const m = document.getElementById(btn.dataset.open); m.hidden = false; const i = m.querySelector('input'); if (i) i.focus();
    }));
    view.querySelectorAll('.mbg').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) m.hidden = true; }));
    view.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => { b.closest('.mbg').hidden = true; }));
    view.querySelectorAll('[data-toast]').forEach((b) => b.addEventListener('click', () => showSaved(b.dataset.toast)));
    view.querySelectorAll('[data-search]').forEach((inp) => inp.addEventListener('input', () => {
      const q = inp.value.trim().toLowerCase();
      inp.closest('.tbar').nextElementSibling.querySelectorAll('tbody tr').forEach((tr) => { tr.hidden = !!q && !tr.textContent.toLowerCase().includes(q); });
    }));
    view.querySelectorAll('[data-rowtest]').forEach((btn) => btn.addEventListener('click', () => {
      const cell = btn.closest('tr').querySelector('.stcell'), was = cell.innerHTML;
      cell.innerHTML = '<span class="status checking"><span class="spin"></span> Проверяем…</span>'; btn.disabled = true;
      setTimeout(() => { cell.innerHTML = '<span class="st ok">✓ доступен</span>'; btn.disabled = false; setTimeout(() => { cell.innerHTML = was; }, 1600); }, 900);
    }));
  }
  const toast = document.getElementById('toast');
  function showSaved(msg) { toast.textContent = msg || 'Настройки сохранены'; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }

  renderNav();
  render(location.hash.slice(1) || 'chat');
</script>
